<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OREKI AI V10 - SENSITIVITY ANALYZER</title>
    <style>
        :root {
            --cyan: #00f3ff; --red: #ff0055; --green: #39ff14;
            --gold: #ffca2c; --purple: #bc13fe; --bg: #010103;
        }

        body {
            margin: 0; font-family: 'Consolas', monospace;
            background: var(--bg); color: #fff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        /* Container Thông báo góc trái */
        #notify-container { position: fixed; top: 15px; left: 15px; width: 280px; z-index: 10000; }
        .toast {
            background: rgba(0, 0, 0, 0.9); border-left: 4px solid var(--cyan);
            color: #eee; padding: 10px; margin-bottom: 6px; border-radius: 4px;
            font-size: 11px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: slideIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            backdrop-filter: blur(10px);
        }
        @keyframes slideIn { from { transform: translateX(-110%); } to { transform: translateX(0); } }
        
        /* Hiệu ứng Bark AI */
        .bark-mode { animation: earthquake 0.05s infinite; filter: contrast(1.2); }
        @keyframes earthquake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(1px, -1px); } }

        .card {
            width: 420px; background: rgba(10, 10, 15, 0.98); border: 1px solid #333;
            border-radius: 15px; padding: 25px; box-shadow: 0 0 100px #000;
            position: relative; border-top: 3px solid var(--cyan);
        }

        h2 { text-align: center; color: var(--cyan); letter-spacing: 3px; font-size: 18px; text-shadow: 0 0 10px var(--cyan); margin-bottom: 20px; }

        /* Màn hình phân tích & Kết quả Độ nhạy */
        #ai-screen {
            background: #000; border: 1px solid #222;
            padding: 12px; min-height: 130px; font-size: 10px; color: var(--green);
            margin-bottom: 15px; border-radius: 8px;
        }

        .sens-result {
            display: none; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-top: 10px; border-top: 1px solid #333; padding-top: 10px;
        }
        .sens-item { color: #aaa; font-size: 11px; }
        .sens-item b { color: var(--green); float: right; }

        .menu-scroll { max-height: 200px; overflow-y: auto; padding-right: 5px; margin-bottom: 15px; }
        .menu-scroll::-webkit-scrollbar { width: 3px; }
        .menu-scroll::-webkit-scrollbar-thumb { background: var(--cyan); }

        .row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 15px; background: rgba(255,255,255,0.03); margin-bottom: 5px; border-radius: 8px;
        }
        .row span { font-size: 12px; font-weight: bold; }

        .switch { position: relative; width: 34px; height: 18px; }
        .switch input { display: none; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background: #fff; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: var(--green); }
        input:checked + .slider:before { transform: translateX(16px); }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px;
        }
        .btn-on-all { background: linear-gradient(90deg, var(--red), var(--purple)); color: white; box-shadow: 0 0 15px var(--red); margin-bottom: 10px; }
        
        .social { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-z { background: #0068ff; color: white; }
        .btn-f { background: #1877f2; color: white; }
    </style>
</head>
<body>

    <div id="notify-container"></div>

    <div id="login-ui" class="card">
        <h2>OREKI AI LOGIN</h2>
        <input type="password" id="key" placeholder="NHẬP KEY: admin" style="width:100%; padding:14px; background:#000; border:1px solid #333; color:#fff; border-radius:8px; margin-bottom:15px; outline:none;">
        <select id="device" style="width:100%; padding:14px; background:#000; border:1px solid #333; color:#fff; border-radius:8px; margin-bottom:20px;">
            <option value="">-- CHỌN DÒNG IPHONE --</option>
            <option value="iphone x ">iphone x r </option>
            <option value="iPhone 11">iPhone 11 Pro Max</option>
            <option value="iPhone 13">iPhone 13 Pro Max</option>
            <option value="iPhone 14">iPhone 14 Pro Max</option>
            <option value="iPhone 15">iPhone 15 Pro Max</option>
            <option value="iPhone 16">iPhone 16 Pro Max</option>
        </select>
        <button class="btn" style="background: var(--cyan); color: #000;" onclick="login()">KÍCH HOẠT HỆ THỐNG</button>
    </div>

    <div id="menu-ui" class="card" style="display: none;">
        <h2 id="dev-title">IPHONE SENS ANALYZER</h2>
        
        <div id="ai-screen">
            <div id="ai-logs">Hệ thống: Chờ lệnh phân tích...</div>
            <div id="ai-result" class="sens-result">
                <div class="sens-item">Nhìn Xung Quanh: <b id="s-gen">0</b></div>
                <div class="sens-item">Red Dot Sight: <b id="s-red">0</b></div>
                <div class="sens-item">Ống Ngắm 2x: <b id="s-2x">0</b></div>
                <div class="sens-item">Ống Ngắm 4x: <b id="s-4x">0</b></div>
                <div class="sens-item">Ống Ngắm Snipe: <b id="s-snip">0</b></div>
                <div class="sens-item">DPI Tối Ưu: <b id="s-dpi">0</b></div>
            </div>
        </div>

        <div class="menu-scroll">
            <div class="row"><span>Auto Aimbot Head</span><label class="switch"><input type="checkbox" class="menu-item" data-name="Aimbot Headshot"><span class="slider"></span></label></div>
            <div class="row"><span>Ghim Tâm Siêu Cấp</span><label class="switch"><input type="checkbox" class="menu-item" data-name="Ghim Tâm Siêu Cấp"><span class="slider"></span></label></div>
            <div class="row"><span>Bypass Độ Nhạy 150+</span><label class="switch"><input type="checkbox" class="menu-item" data-name="Bypass Sens 150+"><span class="slider"></span></label></div>
            <div class="row"><span>Chống Rung Tâm AI</span><label class="switch"><input type="checkbox" class="menu-item" data-name="Chống Rung Tâm"><span class="slider"></span></label></div>
            <div class="row"><span>Tối Ưu Hóa Lag/FPS</span><label class="switch"><input type="checkbox" class="menu-item" data-name="Tối Ưu Lag/FPS"><span class="slider"></span></label></div>
        </div>

        <button class="btn btn-on-all" id="btn-run" onclick="runSupremeAI()">⚡ PHÂN TÍCH & BẬT TẤT CẢ</button>

        <div class="social">
            <button class="btn btn-z" onclick="location.href='#'">ZALO</button>
            <button class="btn btn-f" onclick="location.href='#'">FACEBOOK</button>
        </div>
    </div>

    <script>
        function showNotify(text, color = "var(--cyan)") {
            const container = document.getElementById('notify-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderColor = color;
            toast.innerHTML = `<span style="color:var(--gold)">[LOG]</span> ${text}`;
            container.prepend(toast);
            setTimeout(() => { toast.style.transform = 'translateX(-120%)'; toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        function login() {
            const k = document.getElementById('key').value;
            const d = document.getElementById('device').value;
            if(k === "admin" && d !== "") {
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('menu-ui').style.display = 'block';
                document.getElementById('dev-title').innerText = "AI - " + d.toUpperCase();
                showNotify("Đã nhận diện " + d);
            } else { alert("Key 'admin' và phải chọn máy!"); }
        }

        async function runSupremeAI() {
            const logs = document.getElementById('ai-logs');
            const res = document.getElementById('ai-result');
            const btn = document.getElementById('btn-run');
            btn.disabled = true;
            logs.innerHTML = "";
            res.style.display = "none";

            const process = [
                "> Đang truy cập Neural Core...",
                "> Phân tích cấu hình iPhone...",
                "BARK! BARK!",
                "> Đang tính toán Độ nhạy 150+...",
                "WOOF! WOOF!",
                "> Đã tìm thấy cấu hình tối ưu!",
                "> Bắt đầu nạp dữ liệu..."
            ];

            for (let line of process) {
                let div = document.createElement('div');
                div.innerText = line;
                if(line.includes("BARK") || line.includes("WOOF")) {
                    div.style.color = "var(--red)";
                    document.body.classList.add('bark-mode');
                    showNotify("CẢNH BÁO: AI ĐANG SỦA!", "var(--red)");
                    await new Promise(r => setTimeout(r, 150));
                } else { document.body.classList.remove('bark-mode'); }
                logs.appendChild(div);
                await new Promise(r => setTimeout(r, 400));
            }

            // TRẢ VỀ KẾT QUẢ ĐỘ NHẠY
            document.body.classList.remove('bark-mode');
            document.getElementById('s-gen').innerText = "199.5";
            document.getElementById('s-red').innerText = "192.0";
            document.getElementById('s-2x').innerText = "188.0";
            document.getElementById('s-4x').innerText = "185.0";
            document.getElementById('s-snip').innerText = "165.0";
            document.getElementById('s-dpi').innerText = (Math.random() * (1500 - 1300) + 1300).toFixed(0);
            
            res.style.display = "grid";
            showNotify("ĐÃ TRẢ VỀ ĐỘ NHẠY IPHONE TỐI ƯU!", "var(--gold)");

            // BẬT TOÀN BỘ CHỨC NĂNG VÀ HIỆN THÔNG BÁO
            const items = document.querySelectorAll('.menu-item');
            for (let item of items) {
                if(!item.checked) {
                    item.checked = true;
                    const name = item.getAttribute('data-name');
                    showNotify(`[KÍCH HOẠT] ${name}`, "var(--green)");
                    await new Promise(r => setTimeout(r, 200));
                }
            }

            showNotify("ĐANG VÀO GAME FREE FIRE...", "var(--cyan)");
            setTimeout(() => {
                window.location.href = "freefire://";
                btn.disabled = false;
            }, 2000);
        }
    </script>
</body>
</html>
