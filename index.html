<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oreki Cyber AI Tool</title>

<style>
body{margin:0;font-family:Consolas,monospace;background:black;color:lime;text-align:center;padding:20px}
h1{color:#00ff99;text-shadow:0 0 15px lime}

/* LOGIN */
#loginBox{
  max-width:380px;margin:120px auto;border:2px solid lime;border-radius:15px;
  padding:25px;box-shadow:0 0 25px rgba(0,255,0,.5);
  background:rgba(0,255,0,.05)
}
input{width:90%;padding:12px;border-radius:8px;border:1px solid lime;margin:10px 0;background:black;color:lime;font-size:16px}
button{margin-top:12px;padding:14px;font-size:17px;font-weight:bold;border:none;border-radius:10px;cursor:pointer;background:lime;color:black;width:95%}
button:hover{background:#00ff99}
#errorBox{display:none;margin-top:10px;padding:12px;border:2px solid red;border-radius:10px;background:rgba(255,0,0,.15);color:#ff4444;font-weight:bold}

/* MAIN */
#app{display:none}
.card{border:2px solid lime;border-radius:15px;padding:20px;max-width:480px;margin:auto;background:rgba(0,255,0,.05);box-shadow:0 0 25px rgba(0,255,0,.4)}
.menu{text-align:left;margin:15px auto;width:90%;border:1px solid lime;padding:12px;border-radius:10px;background:rgba(0,255,0,.05)}
.menu label{display:block;margin:8px 0}
.statusBox{color:#00ff99;text-shadow:0 0 10px lime}
#result{display:none;margin-top:20px;padding:15px;border:2px solid #00ff99;border-radius:12px;background:rgba(0,255,0,.1)}

/* MATRIX */
#matrixScreen{
  display:none;position:fixed;inset:0;z-index:9999;
  background:black;overflow:hidden
}
canvas{position:absolute;inset:0}
#globe{
  position:relative;z-index:2;font-size:200px;margin-top:20px;
  animation:spin 2s linear infinite
}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#terminal{
  position:relative;z-index:2;margin:15px auto;width:85%;max-width:700px;
  height:45%;overflow-y:auto;border:2px solid lime;
  padding:15px;text-align:left;font-size:14px;
  background:rgba(0,255,0,.07)
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<h1>🔐 LOGIN SYSTEM</h1>
<input id="user" placeholder="Tài khoản">
<input id="pass" type="password" placeholder="Mật khẩu">
<button onclick="login()">ĐĂNG NHẬP</button>
<div id="errorBox"></div>
</div>

<!-- MAIN -->
<div id="app">
<h1>⚡ ZUROASI! CYBER AI TOOL ⚡</h1>

<div class="card">
<p>📱 Nhập tên iPhone:</p>
<input id="device" placeholder="VD: iPhone 11">

<div class="menu">
<p>⚙️ Chức năng:</p>
<label><input type="checkbox" checked> 🚀 FPS Boost</label>
<label><input type="checkbox" checked> 🎯 DPI Config</label>
<label><input type="checkbox"> 🔥 Headshot</label>
<label><input type="checkbox"> 🌀 UMP Trick</label>

<div class="statusBox">✅ Đã bật chức năng AI</div>
</div>

<button onclick="startAI()">🤖 PHÂN TÍCH AI</button>
<div id="result"></div>
</div>
</div>

<!-- MATRIX -->
<div id="matrixScreen">
<canvas id="matrixCanvas"></canvas>
<div id="globe">🌍</div>
<div id="terminal"></div>
</div>

<script>
/* LOGIN */
const USER="admin", PASS="777";
function login(){
  let u=user.value.trim(), p=pass.value.trim();
  if(u===USER && p===PASS){
    loginBox.style.display="none";
    app.style.display="block";
  }else{
    errorBox.style.display="block";
    errorBox.innerHTML="❌ Sai tài khoản hoặc mật khẩu!";
  }
}

/* MATRIX */
function startMatrix(){
  const c=matrixCanvas,ctx=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;
  const letters="01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@";
  const font=18,cols=c.width/font;
  let drops=Array(Math.floor(cols)).fill(1);

  return setInterval(()=>{
    ctx.fillStyle="rgba(0,0,0,.08)";
    ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle="lime";
    ctx.font=font+"px Consolas";

    drops.forEach((y,i)=>{
      const t=letters[Math.floor(Math.random()*letters.length)];
      ctx.fillText(t,i*font,y*font);
      drops[i]=y*font>c.height?0:y+1;
    });
  },50);
}

/* AI */
function randomSens(){return Math.floor(Math.random()*50)+150}

function startAI(){
  let d=device.value.trim();
  if(!d) return alert("⚠️ Nhập thiết bị!");

  matrixScreen.style.display="block";
  terminal.innerHTML="";
  let mat=startMatrix();
  let i=0;

  let run=setInterval(()=>{
    terminal.innerHTML+="[AI] Scanning system line "+i+"...<br>";
    terminal.scrollTop=terminal.scrollHeight;
    i++;
    if(i>=180){
      clearInterval(run);
      setTimeout(()=>{
        clearInterval(mat);
        matrixScreen.style.display="none";
        result.style.display="block";
        result.innerHTML=`
================================================<br>
<b>KẾT QUẢ TỐI ƯU HÓA: ${d.toUpperCase()}</b><br>
================================================<br><br>

[ ĐỘ NHẠY FREE FIRE MAX ]<br>
> Tổng quan: ${randomSens()}<br>
> Red Dot: ${randomSens()}<br>
> Scope 2x: ${randomSens()}<br>
> Scope 4x: ${randomSens()}<br>
> Sniper: ${randomSens()}<br>
> Free Look: ${randomSens()}<br><br>

[ LỜI KHUYÊN AI ]<br>
> Cấu hình ổn định + headshot mượt 🔥
        `;
      },1000);
    }
  },30);
}
</script>

</body>
</html>
